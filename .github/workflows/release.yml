name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip release creation)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency: release

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: .gocache/mod
          key: ${{ runner.os }}-go-1.24-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.24-
            ${{ runner.os }}-go-

      - name: Vet
        run: go vet ./...

      - name: Format check (gofmt)
        run: test -z "$(gofmt -l . 2>&1 | grep -v '^\.gocache/' | grep -v '^\.qwen/')"

      - name: Test (untagged)
        run: go test ./... -race -count=1

      - name: Test (slive_internal)
        run: go test -tags slive_internal ./... -race -count=1

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: .gocache/mod
          key: ${{ runner.os }}-go-1.24-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.24-
            ${{ runner.os }}-go-

      - name: Build binary
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }} -X main.date=${DATE}" -o dist/slive ./cmd/slive
          tar -czf dist/slive_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz -C dist slive
          rm dist/slive
          sha256sum dist/*.tar.gz > dist/checksums.txt
          cat dist/checksums.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slive_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*.tar.gz
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: "${{ !inputs.dry_run }}"
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          ls -lh dist/
          sha256sum dist/*.tar.gz > dist/checksums.txt
          cat dist/checksums.txt

      - name: Prerelease guard check
        if: "${{ !contains(github.ref_name, '-rc') }}"
        run: 'echo "Stable release: ${{ github.ref_name }} will be marked as latest"'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          fail_on_unmatched_files: true
          prerelease: "${{ contains(github.ref_name, '-rc') }}"
          make_latest: "${{ !contains(github.ref_name, '-rc') }}"

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: "${{ !inputs.dry_run }}"
    permissions:
      contents: read
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: sajadbayatani/slive
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-rc') }}
          labels: |
            org.opencontainers.image.title=slive
            org.opencontainers.image.description=Slive WebRTC SFU
            org.opencontainers.image.source=https://github.com/sajadbayatani/slive
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
