# Slive local coturn configuration.
#
# Non-secret settings live here. Credentials MUST NOT be committed to this
# file: pass --user via the Docker Compose command, sourced from
# TURN_USERNAME/TURN_PASSWORD in the environment (see docker-compose.yml).
# TURN_REALM is likewise supplied on the command line so one variable owns it.

# UDP first (primary), TCP listener kept for allocation fallback.
listening-port=3478
no-tls
no-dtls

# Long-term credential mechanism; --user on the command line enables it.
lt-cred-mech
fingerprint

# Narrow relay port range so Docker only needs to publish a small window.
min-port=49160
max-port=49170

# Verbose enough to see allocations during local debugging; quiet down in prod.
verbose
log-file=stdout
no-stdout-log
